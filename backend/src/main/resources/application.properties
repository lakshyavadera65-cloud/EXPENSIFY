spring.application.name=expensify-backend
server.port=${PORT:8080}

# Your SQL teammate provides these database values.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expensify}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

weather.api.base-url=${WEATHER_API_BASE_URL:https://weather.googleapis.com/v1}
weather.api.key=${WEATHER_API_KEY:}

spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
